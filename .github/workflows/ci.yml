name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build and test (windows-2022)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Format
        run: cargo fmt --all

      - name: Refresh lockfile
        run: cargo generate-lockfile

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --workspace --release

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Check binary size
        shell: pwsh
        run: ./scripts/check-size.ps1 -ExePath "target/release/win10-settings.exe" -MaxMb 15

      - name: Upload formatted sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-sources-${{ github.sha }}
          path: |
            Cargo.lock
            crates/**/src/*.rs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win10-settings-rs-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
