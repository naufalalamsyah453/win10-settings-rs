[package]
name = "settings-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "win10-settings"
path = "src/main.rs"

[features]
default = ["light"]
light = ["iced/tiny-skia"]
gpu = ["iced/wgpu"]

[dependencies]
iced = { version = "0.14", default-features = false, features = ["advanced", "thread-pool", "crisp", "svg"] }
open = "5"
settings-core = { path = "../settings-core" }
settings-platform = { path = "../settings-platform" }

[lints]
workspace = true
